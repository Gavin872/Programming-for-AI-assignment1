[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
description = "A NumPy-based machine learning utility framework"
requires-python = ">=3.9"
dependencies = [
    "numpy"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter"
]

[tool.setuptools.packages.find]
include = ["numcompute*"]
exclude = ["demo*", "tests*"]